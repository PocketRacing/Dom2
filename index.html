<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdultStars</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#090909;
    color:#fff;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#111;
    border-bottom:1px solid #292929;
    padding:14px;
}
.header-row{
    max-width:1100px;
    margin:auto;
    display:flex;
    gap:10px;
    align-items:center;
}
.logo{
    color:#ff7a00;
    font-size:22px;
    font-weight:800;
    white-space:nowrap;
}
.search{
    flex:1;
    background:#1b1b1b;
    color:white;
    border:1px solid #333;
    border-radius:12px;
    padding:11px 14px;
    outline:none;
}
.icon-btn,.orange-btn{
    border:0;
    border-radius:11px;
    padding:10px 13px;
    background:#ff7a00;
    color:#111;
    font-weight:700;
}
.dark-btn{
    border:1px solid #333;
    background:#191919;
    color:#fff;
    border-radius:10px;
    padding:9px 12px;
}
.red-btn{
    border:1px solid #612020;
    background:#281313;
    color:#ff8d8d;
    border-radius:10px;
    padding:9px 12px;
}
.green-btn{
    border:1px solid #285b35;
    background:#132519;
    color:#8be39b;
    border-radius:10px;
    padding:9px 12px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px 14px 100px;
}

.top-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:14px;
}

.card{
    background:#141414;
    border:1px solid #292929;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}
.card:hover{
    transform:translateY(-2px);
    border-color:#ff7a00;
}
.card-photo-wrap{
    position:relative;
}
.card-photo{
    width:100%;
    height:250px;
    object-fit:cover;
    background:#222;
    display:block;
}
.photo-counter{
    position:absolute;
    right:8px;
    bottom:8px;
    background:rgba(0,0,0,.75);
    border-radius:8px;
    padding:5px 8px;
    font-size:12px;
}
.card-body{padding:13px}
.card-name{
    font-size:18px;
    font-weight:800;
}
.card-ru{
    margin-top:3px;
    color:#aaa;
    font-size:12px;
}
.card-meta{
    color:#999;
    font-size:12px;
    margin-top:8px;
}
.card-status{
    display:inline-block;
    margin-top:7px;
    font-size:11px;
    color:#ff8d8d;
}
.card-buttons{
    display:flex;
    gap:7px;
    margin-top:12px;
    flex-wrap:wrap;
}
.card-buttons button{
    flex:1;
    min-width:70px;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#888;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:100;
    display:none;
    overflow:auto;
    padding:20px;
}
.modal-bg.show{display:block}

.modal{
    max-width:760px;
    margin:30px auto;
    background:#141414;
    border:1px solid #333;
    border-radius:18px;
    padding:20px;
}
.modal h2{
    margin-top:0;
    color:#ff7a00;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.field{margin-bottom:12px}
.field.full{grid-column:1/-1}
.field label{
    display:block;
    color:#bbb;
    font-size:13px;
    margin-bottom:6px;
}
.field input,
.field textarea,
.field select{
    width:100%;
    background:#0d0d0d;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    padding:11px;
    outline:none;
}
.field textarea{
    min-height:90px;
    resize:vertical;
}
.modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:15px;
    flex-wrap:wrap;
}

.quick-search{
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    padding:12px;
    margin-bottom:14px;
}
.quick-search-title{
    font-size:13px;
    color:#aaa;
    margin-bottom:8px;
}
.quick-search-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
.quick-search-row input{
    flex:1;
    min-width:180px;
    background:#0d0d0d;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    padding:10px;
}
.search-links{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:9px;
}

.photo-preview-list{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 0;
}
.photo-preview{
    width:80px;
    height:90px;
    object-fit:cover;
    border-radius:9px;
    border:1px solid #333;
    flex:none;
}

.tabs{
    display:flex;
    gap:7px;
    margin-bottom:18px;
    overflow-x:auto;
}
.tab{
    white-space:nowrap;
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    padding:9px 13px;
    border-radius:10px;
}
.tab.active{
    background:#ff7a00;
    color:#111;
    border-color:#ff7a00;
}

.profile-head{
    display:flex;
    gap:20px;
    align-items:flex-start;
}
.profile-photo{
    width:180px;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    background:#222;
}
.profile-gallery{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:10px;
}
.profile-thumb{
    width:65px;
    height:75px;
    object-fit:cover;
    border-radius:8px;
    border:2px solid #333;
    cursor:pointer;
}
.profile-thumb.active{
    border-color:#ff7a00;
}
.profile-info{flex:1}
.profile-original{
    font-size:27px;
    font-weight:800;
}
.profile-russian{
    color:#aaa;
    margin-top:4px;
}
.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:12px;
}
.tag{
    background:#222;
    color:#bbb;
    border-radius:20px;
    padding:6px 9px;
    font-size:12px;
}
.section{
    margin-top:22px;
    background:#111;
    border:1px solid #292929;
    border-radius:15px;
    padding:15px;
}
.section h3{
    margin-top:0;
    color:#ff7a00;
}
.link-list a{
    display:block;
    color:#ff963d;
    margin:7px 0;
    word-break:break-all;
}

.chat{
    max-width:750px;
    margin:auto;
}
.chat-window{
    height:500px;
    overflow-y:auto;
    background:#101010;
    border:1px solid #292929;
    border-radius:15px;
    padding:14px;
}
.message{
    max-width:80%;
    padding:10px 13px;
    margin:8px 0;
    border-radius:14px;
    line-height:1.4;
}
.message.user{
    margin-left:auto;
    background:#ff7a00;
    color:#111;
}
.message.bot{
    background:#222;
    color:#fff;
}
.chat-input{
    display:flex;
    gap:8px;
    margin-top:10px;
}
.chat-input input{
    flex:1;
    background:#171717;
    color:white;
    border:1px solid #333;
    border-radius:12px;
    padding:12px;
}

.dictionary-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.dictionary-item{
    background:#111;
    border:1px solid #292929;
    border-radius:12px;
    padding:12px;
}
.dictionary-item strong{color:#ff963d}
.dictionary-item small{
    display:block;
    color:#999;
    margin-top:5px;
}
.dictionary-actions{
    margin-top:8px;
    display:flex;
    gap:7px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    border-top:1px solid #292929;
    display:flex;
    justify-content:center;
    gap:8px;
    padding:9px;
    z-index:30;
}
.bottom-nav button{
    background:#191919;
    color:#aaa;
    border:1px solid #292929;
    border-radius:10px;
    padding:9px 13px;
}
.bottom-nav button.active{
    color:#111;
    background:#ff7a00;
}

@media(max-width:650px){
    .header-row{flex-wrap:wrap}
    .logo{width:100%}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
    .profile-head{flex-direction:column}
    .profile-photo{width:100%;height:300px}
    .chat-window{height:430px}
}
</style>
</head>

<body>

<header>
    <div class="header-row">
        <div class="logo">AdultStars</div>

        <input id="search"
               class="search"
               placeholder="Поиск анкеты..."
               oninput="render()">

        <button class="icon-btn" onclick="randomProfile()">🎲</button>
    </div>
</header>

<div class="container">

    <div class="tabs">
        <button id="tabProfiles" class="tab active" onclick="showPage('profiles')">Анкеты</button>
        <button id="tabChat" class="tab" onclick="showPage('chat')">💬 Чат</button>
        <button id="tabDictionary" class="tab" onclick="showPage('dictionary')">📖 Словарь</button>
    </div>

    <section id="profilesPage">

        <div class="top-actions">
            <button class="orange-btn" onclick="openProfileEditor()">➕ Новая анкета</button>
            <button class="dark-btn" onclick="showFavorites()">⭐ Избранное</button>
            <button class="dark-btn" onclick="showAll()">Все анкеты</button>
            <button class="red-btn" onclick="showBlacklist()">🚫 ЧС <span id="blacklistCount"></span></button>
        </div>

        <div id="profilesGrid" class="grid"></div>

    </section>

    <section id="chatPage" style="display:none">

        <div class="chat">
            <div class="section">
                <h2 style="margin-top:0">💬 Чат</h2>
                <p style="color:#999">
                    Ответы формируются из твоего собственного словаря и встроенных нейтральных фраз.
                </p>
            </div>

            <div id="chatWindow" class="chat-window"></div>

            <div class="chat-input">
                <input id="chatInput"
                       placeholder="Напиши сообщение..."
                       onkeydown="if(event.key==='Enter')sendMessage()">

                <button class="orange-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>

    </section>

    <section id="dictionaryPage" style="display:none">

        <div class="top-actions">
            <button class="orange-btn" onclick="openDictionaryEditor()">➕ Добавить фразу</button>
            <button class="dark-btn" onclick="resetDictionary()">↩ Восстановить встроенный словарь</button>
        </div>

        <div class="section">
            <h2 style="margin-top:0">📖 Мой словарь</h2>

            <p style="color:#888">
                Добавляй свои слова, фразы и ответы. Они сохраняются в браузере.
            </p>

            <div id="dictionaryList" class="dictionary-list"></div>
        </div>

    </section>

</div>

<div class="bottom-nav">
    <button id="navProfiles" class="active" onclick="showPage('profiles')">👤 Анкеты</button>
    <button id="navChat" onclick="showPage('chat')">💬 Чат</button>
    <button id="navDictionary" onclick="showPage('dictionary')">📖 Словарь</button>
</div>


<!-- PROFILE VIEW -->

<div id="profileModal" class="modal-bg">
    <div class="modal">

        <div id="profileContent"></div>

        <div class="modal-actions">

            <button class="dark-btn"
                    onclick="closeModal('profileModal')">
                Закрыть
            </button>

            <button class="red-btn"
                    onclick="blacklistCurrentProfile()">
                🚫 В ЧС
            </button>

            <button class="red-btn"
                    onclick="deleteCurrentProfile()">
                🗑️ Удалить
            </button>

            <button class="orange-btn"
                    onclick="editCurrentProfile()">
                ✏️ Редактировать
            </button>

        </div>
    </div>
</div>


<!-- PROFILE EDITOR -->

<div id="profileEditorModal" class="modal-bg">
    <div class="modal">

        <h2 id="profileEditorTitle">Новая анкета</h2>

        <div class="quick-search">

            <div class="quick-search-title">
                🔎 Быстрый поиск информации по имени
            </div>

            <div class="quick-search-row">

                <input id="quickSearchName"
                       placeholder="Например: имя актрисы">

                <button class="orange-btn"
                        onclick="quickBrowserSearch()">
                    🔎 Искать
                </button>

            </div>

            <div class="search-links">

                <button class="dark-btn"
                        onclick="searchGoogle()">
                    Google
                </button>

                <button class="dark-btn"
                        onclick="searchBing()">
                    Bing
                </button>

                <button class="dark-btn"
                        onclick="searchImages()">
                    🖼️ Картинки
                </button>

            </div>

        </div>

        <div class="form-grid">

            <div class="field">
                <label>Имя / оригинальное название</label>

                <input id="pName"
                       oninput="syncQuickSearch()">
            </div>

            <div class="field">
                <label>Русское название</label>

                <input id="pRuName">
            </div>

            <div class="field">
                <label>Страна</label>

                <input id="pCountry">
            </div>

            <div class="field">
                <label>Дата / год</label>

                <input id="pDebut">
            </div>

            <div class="field full">
                <label>Описание</label>

                <textarea id="pDescription"></textarea>
            </div>

            <div class="field full">
                <label>Теги через запятую</label>

                <input id="pTags"
                       placeholder="например: актриса, модель">
            </div>

            <div class="field full">
                <label>Сайты — каждый с новой строки</label>

                <textarea id="pWebsites"
                          placeholder="https://example.com"></textarea>
            </div>

            <div class="field full">
                <label>Видео — каждое с новой строки</label>

                <textarea id="pVideos"
                          placeholder="https://example.com/video"></textarea>
            </div>

            <div class="field full">

                <label>
                    Фото — можно выбрать сразу несколько
                </label>

                <input type="file"
                       id="pPhoto"
                       accept="image/*"
                       multiple
                       onchange="previewSelectedPhotos()">

                <div id="photoPreviewList"
                     class="photo-preview-list">
                </div>

            </div>

        </div>

        <div class="modal-actions">

            <button class="dark-btn"
                    onclick="closeModal('profileEditorModal')">
                Отмена
            </button>

            <button class="orange-btn"
                    onclick="saveProfile()">
                💾 Сохранить
            </button>

        </div>

    </div>
</div>


<!-- DICTIONARY EDITOR -->

<div id="dictionaryEditorModal" class="modal-bg">

    <div class="modal">

        <h2 id="dictionaryEditorTitle">Новая фраза</h2>

        <div class="field">

            <label>Что должен написать пользователь</label>

            <input id="dictQuestion"
                   placeholder="например: привет">

        </div>

        <div class="field">

            <label>Ответ чата</label>

            <textarea id="dictAnswer"
                      placeholder="Например: Привет! Рад тебя видеть 😊">
            </textarea>

        </div>

        <div class="field">

            <label>Дополнительные варианты ответа</label>

            <textarea id="dictVariants"
                      placeholder="Каждый вариант с новой строки">
            </textarea>

        </div>

        <div class="modal-actions">

            <button class="dark-btn"
                    onclick="closeModal('dictionaryEditorModal')">
                Отмена
            </button>

            <button class="orange-btn"
                    onclick="saveDictionaryItem()">
                💾 Сохранить
            </button>

        </div>

    </div>

</div>

/* =========================
   ПРОФИЛЬ ПО УМОЛЧАНИЮ
========================= */

function defaultProfile(name){

    return {
        name:name,
        ruName:russianNames[name] || "",
        country:"—",
        debut:"—",
        description:"Профиль пока не заполнен. Его можно отредактировать.",
        tags:["профиль"],
        websites:[],
        videos:[],
        photos:[],
        photo:"",
        custom:false
    };
}


/* =========================
   НОРМАЛИЗАЦИЯ
========================= */

function normalizeProfile(p,name){

    const oldPhotos =
        Array.isArray(p.photos)
        ? p.photos
        : (p.photo ? [p.photo] : []);

    return {
        ...defaultProfile(name),
        ...p,
        name:name,
        ruName:p.ruName || russianNames[name] || "",
        tags:Array.isArray(p.tags)?p.tags:[],
        websites:Array.isArray(p.websites)?p.websites:[],
        videos:Array.isArray(p.videos)?p.videos:[],
        photos:oldPhotos,
        photo:oldPhotos[0] || "",
        custom:!!p.custom
    };
}

function render(){

    const grid=document.getElementById("profilesGrid");

    const query=
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let list=Object.values(profiles);

    if(blacklistOnly){

        list=list.filter(p=>
            blacklist.includes(p.name)
        );

    }else{

        list=list.filter(p=>
            !blacklist.includes(p.name)
        );

    }

    if(favoritesOnly){

        list=list.filter(p=>
            favorites.includes(p.name)
        );

    }

    if(query){

        list=list.filter(p=>

            p.name.toLowerCase().includes(query) ||

            (p.ruName||"")
                .toLowerCase()
                .includes(query) ||

            (p.country||"")
                .toLowerCase()
                .includes(query) ||

            (p.description||"")
                .toLowerCase()
                .includes(query) ||

            (p.tags||[])
                .join(" ")
                .toLowerCase()
                .includes(query)

        );

    }

    if(!list.length){

        grid.innerHTML=
            '<div class="empty">Ничего не найдено</div>';

        updateBlacklistCount();

        return;
    }

    grid.innerHTML=list.map(p=>{

        const isFav=favorites.includes(p.name);

        const photos=p.photos||[];

        const firstPhoto=
            photos[0] || p.photo || "";

        return `

        <article class="card">

            <div class="card-photo-wrap">

                ${
                    firstPhoto

                    ?

                    `<img class="card-photo"
                          src="${firstPhoto}"
                          alt="">`

                    :

                    `<div class="card-photo"
                          style="display:flex;align-items:center;justify-content:center;font-size:55px">
                        👤
                     </div>`
                }

                ${
                    photos.length>1
                    ?
                    `<div class="photo-counter">
                        🖼️ ${photos.length}
                     </div>`
                    :""
                }

            </div>

            <div class="card-body">

                <div class="card-name">
                    ${escapeHTML(p.name)}
                </div>

                ${
                    p.ruName
                    ?
                    `<div class="card-ru">
                        ${escapeHTML(p.ruName)}
                     </div>`
                    :""
                }

                <div class="card-meta">
                    ${escapeHTML(p.country || "—")}
                </div>

                ${
                    blacklistOnly
                    ?
                    `<div class="card-status">
                        🚫 Карточка находится в ЧС
                     </div>`
                    :""
                }

                <div class="card-buttons">

                    <button class="orange-btn"
                            onclick="openProfile('${escapeAttr(p.name)}')">
                        Открыть
                    </button>

                    <button class="dark-btn"
                            onclick="toggleFavorite('${escapeAttr(p.name)}')">
                        ${isFav?"★":"☆"}
                    </button>

                </div>

                <div class="card-buttons">

                    ${
                        blacklistOnly

                        ?

                        `<button class="green-btn"
                                 onclick="restoreFromBlacklist('${escapeAttr(p.name)}')">
                            ♻️ Вернуть
                         </button>`

                        :

                        `<button class="red-btn"
                                 onclick="blacklistProfile('${escapeAttr(p.name)}')">
                            🚫 ЧС
                         </button>`
                    }

                    <button class="red-btn"
                            onclick="deleteProfile('${escapeAttr(p.name)}')">
                        🗑️
                    </button>

                </div>

            </div>

        </article>

        `;

    }).join("");

    updateBlacklistCount();
}

function showBlacklist(){

    favoritesOnly=false;
    blacklistOnly=false;

function updateBlacklistCount(){

    const el=document.getElementById("blacklistCount");

    if(el){
        el.textContent =
            blacklist.length
            ? `(${blacklist.length})`
            : "";
    }
}

function blacklistProfile(name){

    if(!profiles[name])return;

    if(!blacklist.includes(name)){
        blacklist.push(name);
    }

    favorites=
        favorites.filter(x=>x!==name);

    saveBlacklist();
    saveFavorites();

    render();
}

function restoreFromBlacklist(name){

    blacklist=
        blacklist.filter(x=>x!==name);

    saveBlacklist();

    render();
}

function blacklistCurrentProfile(){

    if(!currentProfileName)return;

    blacklistProfile(currentProfileName);

    closeModal("profileModal");
}

function deleteProfile(name){

    if(!profiles[name])return;

    if(!confirm(
        "Удалить эту карточку полностью?\n\nДанные карточки будут удалены из браузера."
    )){
        return;
    }

    delete profiles[name];

    favorites=
        favorites.filter(x=>x!==name);

    blacklist=
        blacklist.filter(x=>x!==name);

    saveProfiles();
    saveFavorites();
    saveBlacklist();

    if(currentProfileName===name){
        currentProfileName=null;
    }

    render();
}

function deleteCurrentProfile(){

    if(!currentProfileName)return;

    const name=currentProfileName;

    closeModal("profileModal");

    deleteProfile(name);
}

        favorites=

        favorites.push(name);

    }

    saveFavorites();

    render();
}

    blacklistOnly=false;

    render();
}

function randomProfile(){

    let names=
        Object.keys(profiles)
        .filter(name=>!blacklist.includes(name));

    if(!names.length)return;

    const name=
        names[Math.floor(
            Math.random()*names.length
        )];

    openProfile(name);
}

function changeProfilePhoto(index){

    if(!currentProfileName)return;

    const p=
        normalizeProfile(
            profiles[currentProfileName],
            currentProfileName
        );

    const photo=p.photos[index];

    if(!photo)return;

    const main=
        document.getElementById("profileMainPhoto");

    if(main && main.tagName==="IMG"){
        main.src=photo;
    }

    document.querySelectorAll(".profile-thumb")
        .forEach((el,i)=>{
            el.classList.toggle(
                "active",
                i===index
            );
        });
}

function renderExistingPhotos(photos){

    const box=
        document.getElementById(
            "photoPreviewList"
        );

    if(!photos.length){

        box.innerHTML=
            '<span style="color:#666;font-size:12px">Фотографий пока нет</span>';

        return;
    }

    box.innerHTML=
        photos.map((photo,index)=>`

            <img
                class="photo-preview"
                src="${photo}"
                title="Фото ${index+1}"
            >

        `).join("");
}

function previewSelectedPhotos(){

    const input=
        document.getElementById("pPhoto");

    const files=
        Array.from(input.files || []);

    const box=
        document.getElementById(
            "photoPreviewList"
        );

    if(!files.length)return;

    box.innerHTML="";

    files.forEach(file=>{

        const reader=
            new FileReader();

        reader.onload=e=>{

            const img=
                document.createElement("img");

            img.className=
                "photo-preview";

            img.src=
                e.target.result;

            box.appendChild(img);

        };

        reader.readAsDataURL(file);

    });
}

/* =========================
   СОХРАНЕНИЕ ПРОФИЛЯ
========================= */

function saveProfile(){

    const oldName=
        editingProfileName;

    let name=
        document.getElementById(
            "pName"
        ).value.trim();

    const ruName=
        document.getElementById(
            "pRuName"
        ).value.trim();

    const country=
        document.getElementById(
            "pCountry"
        ).value.trim();

    const debut=
        document.getElementById(
            "pDebut"
        ).value.trim();

    const description=
        document.getElementById(
            "pDescription"
        ).value.trim();

    if(!name){

        alert(
            "Укажи название анкеты."
        );

        return;
    }

    if(oldName &&
       baseNames.includes(oldName)){

        name=oldName;
    }

    if(oldName &&
       oldName!==name &&
       profiles[name]){

        alert(
            "Анкета с таким названием уже существует."
        );

        return;
    }

    const old=
        oldName

        ?

        normalizeProfile(
            profiles[oldName],
            oldName
        )

        :

        defaultProfile(name);

    const fileInput=
        document.getElementById(
            "pPhoto"
        );

    const files=
        Array.from(
            fileInput.files || []
        );

    const finish=(newPhotos)=>{

        const p={

            ...old,

            name:name,

            ruName:ruName,

            country:country,

            debut:debut,

            description:description,

            tags:
                document.getElementById(
                    "pTags"
                ).value
                .split(",")
                .map(x=>x.trim())
                .filter(Boolean),

            websites:
                document.getElementById(
                    "pWebsites"
                ).value
                .split("\n")
                .map(x=>x.trim())
                .filter(Boolean),

            videos:
                document.getElementById(
                    "pVideos"
                ).value
                .split("\n")
                .map(x=>x.trim())
                .filter(Boolean),

            custom:
                !baseNames.includes(name)
                || old.custom

        };

        if(newPhotos.length){

            p.photos=[
                ...(old.photos||[]),
                ...newPhotos
            ];

        }else{

            p.photos=
                old.photos||[];

        }

        p.photo=
            p.photos[0]||"";

        if(oldName &&
           oldName!==name){

            delete profiles[oldName];

            favorites=
                favorites.map(
                    x=>x===oldName
                    ? name
                    : x
                );

            blacklist=
                blacklist.map(
                    x=>x===oldName
                    ? name
                    : x
                );

            saveFavorites();
            saveBlacklist();
        }

        profiles[name]=p;

        saveProfiles();

        editingProfileName=null;

        closeModal(
            "profileEditorModal"
        );

        render();

        if(currentProfileName===oldName){

            currentProfileName=name;

        }

    };

    if(!files.length){

        finish([]);

        return;
    }

    const newPhotos=[];

    let loaded=0;

    files.forEach(file=>{

        const reader=
            new FileReader();

        reader.onload=e=>{

            newPhotos.push(
                e.target.result
            );

            loaded++;

            if(loaded===files.length){

                finish(newPhotos);

            }

        };

        reader.readAsDataURL(file);

    });
}

        index===null

        ?

        {q:"",a:"",variants:[]}

        :

        dictionary[index];

    document.getElementById(
        "dictQuestion"
    ).value=item.q||"";

    document.getElementById(
        "dictAnswer"
    ).value=item.a||"";

    document.getElementById(
        "dictVariants"
    ).value=
        (item.variants||[]).join("\n");

    document.getElementById(
        "dictionaryEditorModal"
    ).classList.add("show");

}

function saveDictionaryItem(){

    const q=
        document.getElementById(
            "dictQuestion"
        ).value.trim();

    const a=
        document.getElementById(
            "dictAnswer"
        ).value.trim();

    if(!q || !a){

        alert(
            "Заполни фразу пользователя и ответ."
        );

        return;
    }

    const item={

        q:q.toLowerCase(),

        a:a,

        variants:
            document.getElementById(
                "dictVariants"
            ).value
            .split("\n")
            .map(x=>x.trim())
            .filter(Boolean)

    };

    if(editingDictionaryIndex===null){

        dictionary.push(item);

    }else{

        dictionary[
            editingDictionaryIndex
        ]=item;

    }

    saveDictionary();

    renderDictionary();

    closeModal(
        "dictionaryEditorModal"
    );

    editingDictionaryIndex=null;
}

function deleteDictionaryItem(index){

    if(!confirm(
        "Удалить эту фразу?"
    ))return;

    dictionary.splice(
        index,
        1
    );

    saveDictionary();

    renderDictionary();
}

function resetDictionary(){

    if(!confirm(
        "Восстановить встроенный словарь?"
    ))return;

    dictionary=
        JSON.parse(
            JSON.stringify(
                defaultDictionary
            )
        );

    saveDictionary();

    renderDictionary();
}


/* =========================
   ЧАТ
========================= */

function sendMessage(){

    const input=
        document.getElementById(
            "chatInput"
        );

    const text=
        input.value.trim();

    if(!text)return;

    addChatMessage(
        "user",
        text
    );

    input.value="";

    setTimeout(()=>{

        const reply=
            generateChatReply(text);

        addChatMessage(
            "bot",
            reply
        );

        saveChat();

    },250);
}

function generateChatReply(text){

    const lower=
        text.toLowerCase();

    const sorted=
        [...dictionary]
        .sort(
            (a,b)=>
                (b.q||"").length-
                (a.q||"").length
        );

    for(const item of sorted){

        if(
            lower.includes(
                item.q.toLowerCase()
            )
        ){

            const answers=[

                item.a,

                ...(item.variants||[])

            ].filter(Boolean);

            if(answers.length){

                return answers[
                    Math.floor(
                        Math.random()*
                        answers.length
                    )
                ];

            }

        }

    }

    const generic=[

        "Интересно 😊 Расскажи подробнее.",

        "Понял тебя. А что ты сам об этом думаешь?",

        "Хорошо 😊 Продолжай.",

        "Звучит интересно.",

        "Можешь рассказать об этом чуть подробнее?",

        "Понимаю тебя.",

        "Интересная тема. Давай обсудим.",

        "Хорошо, я тебя слушаю.",

        "И что было дальше?",

        "А тебе самому это нравится?",

        "Расскажи немного больше.",

        "Хм, интересно 🤔",

        "Понял. А как ты к этому относишься?",

        "Хороший вопрос."

    ];

    return generic[
        Math.floor(
            Math.random()*
            generic.length
        )
    ];
}

function addChatMessage(type,text){

    const win=
        document.getElementById(
            "chatWindow"
        );

    const div=
        document.createElement(
            "div"
        );

    div.className=
        "message "+type;

    div.textContent=text;

    win.appendChild(div);

    win.scrollTop=
        win.scrollHeight;
}

function saveChat(){

    const messages=[

        ...document.querySelectorAll(
            "#chatWindow .message"
        )

    ].map(x=>({

        type:
            x.classList.contains("user")
            ? "user"
            : "bot",

        text:x.textContent

    }));

    localStorage.setItem(
        "adultstars_chat",
        JSON.stringify(messages)
    );
}

function loadChat(){

    const win=
        document.getElementById(
            "chatWindow"
        );

    if(
        win.dataset.loaded==="1"
    )return;

    win.dataset.loaded="1";

    const messages=
        JSON.parse(
            localStorage.getItem(
                "adultstars_chat"
            ) || "[]"
        );

    if(!messages.length){

        addChatMessage(
            "bot",
            "Привет! 💬 Я чат AdultStars."
        );

        return;
    }

    messages.forEach(
        m=>
            addChatMessage(
                m.type,
                m.text
            )
    );
}


/* =========================
   УТИЛИТЫ
========================= */

function closeModal(id){

    document.getElementById(
        id
    ).classList.remove("show");

}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function escapeAttr(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");

}

function safeURL(url){

    const value=
        String(url||"").trim();

    if(
        /^https?:\/\//i.test(value)
    ){

        return value.replaceAll(
            '"',
            ""
        );

    }

    return "#";
}
