<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111111">

  <title>AdultStars</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f0f;
      --panel: #1c1c1c;
      --panel2: #292929;
      --orange: #ff9900;
      --text: #ffffff;
      --muted: #999999;
      --border: #363636;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: #181818;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .logo span {
      color: var(--orange);
    }

    .header button {
      border: none;
      border-radius: 50%;
      background: var(--orange);
      width: 42px;
      height: 42px;
      font-size: 20px;
    }

    .search {
      padding: 15px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: white;
      outline: none;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 0 15px;
    }

    h1 {
      font-size: 24px;
      margin: 12px 0 20px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .card-photo {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #303030, #101010);
      color: var(--orange);
      font-size: 34px;
      font-weight: bold;
    }

    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-name {
      min-height: 35px;
      font-size: 14px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .actions button,
    .primary,
    .secondary {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
    }

    .actions button:first-child,
    .primary {
      background: var(--orange);
      color: #111;
    }

    .actions button:last-child,
    .secondary {
      background: var(--panel2);
      color: white;
      border: 1px solid var(--border);
    }

    .profile-box,
    .chat-box,
    .setting-box {
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .profile-photo {
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      overflow: hidden;
      border-radius: 50%;
      background: var(--panel2);
      color: var(--orange);
      font-size: 40px;
      font-weight: bold;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-box h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #101010;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    .profile-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chat-messages {
      max-height: 450px;
      min-height: 280px;
      overflow-y: auto;
      padding: 10px 0;
    }

    .message {
      max-width: 85%;
      margin-bottom: 10px;
      padding: 11px;
      border-radius: 12px;
      overflow-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      background: var(--orange);
      color: #111;
    }

    .message.bot {
      background: var(--panel2);
    }

    .chat-input {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-input input {
      min-width: 0;
    }

    .chat-input button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: var(--orange);
      color: #111;
    }

    .notice {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      background: #302600;
      color: #ffd166;
      font-size: 13px;
    }

    .empty {
      padding: 30px 10px;
      color: var(--muted);
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      padding: 8px 3px;
      background: #181818;
      border-top: 1px solid var(--border);
    }

    .bottom-nav button {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 5px 0;
      border: none;
      background: none;
      color: #bbb;
      font-size: 18px;
    }

    .bottom-nav span {
      font-size: 10px;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .bottom-nav {
        right: auto;
        left: 50%;
        width: 650px;
        transform: translateX(-50%);
        border-radius: 15px 15px 0 0;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">
      Adult<span>Stars</span>
    </div>

    <button onclick="randomActress()">🎲</button>
  </header>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="Поиск актрисы..."
      oninput="searchActresses()">
  </div>

  <main>

    <section id="catalogPage" class="page active">
      <h1>Каталог</h1>

      <div id="catalogActions"></div>

      <div id="actressesGrid" class="grid"></div>
    </section>

    <section id="favoritesPage" class="page">
      <h1>Избранное</h1>

      <div id="favoritesGrid" class="grid"></div>
    </section>

    <section id="profilePage" class="page">
      <button class="secondary" onclick="showPage('catalog')">
        ← Назад
      </button>

      <div id="profileContent" style="margin-top:15px;"></div>
    </section>

    <section id="chatPage" class="page">
      <button class="secondary" onclick="showPage('catalog')">
        ← Назад
      </button>

      <div id="chatContent" style="margin-top:15px;"></div>
    </section>

    <section id="challengesPage" class="page">
      <h1>Челленджи</h1>

      <div id="challengesContent"></div>
    </section>

    <section id="preferencesPage" class="page">
      <h1>Настройки</h1>

      <div id="preferencesContent"></div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button onclick="showPage('catalog')">
      🏠
      <span>Главная</span>
    </button>

    <button onclick="showPage('favorites')">
      ⭐
      <span>Избранное</span>
    </button>

    <button onclick="randomActress()">
      🎲
      <span>Рандом</span>
    </button>

    <button onclick="showPage('challenges')">
      🏆
      <span>Задания</span>
    </button>

    <button onclick="showPage('preferences')">
      ⚙️
      <span>Настройки</span>
    </button>
  </nav>

  <script src="app.js"></script>

</body>
</html>
